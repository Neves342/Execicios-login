<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Hall</title>
    <link rel="stylesheet" href="tela2.css">
</head>
<body>
    <header>
        <div class="cabe">
        <img src="senac.png" alt="" class="intro">
        <nav>
            <ul>
                <li><a href="#">Usuário</a></li>
                <li><a href="#">Perfil</a></li>
                <li><a href="#">Evento</a></li>
                <li><a href="#">Dashboard Adm</a></li>
                <li><a href="#">Usuario</a></li>
            </ul>
        </nav>
        </div>
        <div class="linha"></div>
    </header>
    <section>
        <h1>Cadastro de eventos</h1>
        <div class="barra">
        <form action="" class="form">
            <label for="nome_evento">Nome:</label>
            <input type="text" name="nome_evento" id="nome-evento">

            <label for="data">Data do evento:</label>
            <input type="date" name="data" id="data">

            <label for="hora">Horário:</label>
            <input type="time" name="hora" id="hora">

            <label for="quant">Capacidade de pessoas:</label>
            <input type="number" name="quant" id="quant">

            
            <label for="image">Imagem:</label>
            <input type="file" name="image" id="image">

            <label for="local">Local de evento</label>
            <input type="text" name="local" id="local">

            <label for="valor">Preço</label>
            <input type="text" name="valor" id="valor">
            <div class="button">
            <button type="submit">Continuar cadastro</button>
            </div>
        </form>
        </div>
    </section>
    <footer class="rodape">
        <div class="p1">
              <p>FAQ</p>
              <p>Termos de Uso</p>
              <p>Copyright</p>
        </div>
        <div class="p2">
               <p>Patrocinadores</p>
               <p>Política de Privacidade</p>
               <p>&#169 Senac</p>
        </div>
        <div class="p3">
               <p>Apoio</p>
               <p>Redes Sociais</p>
        </div>
      
    </footer>
</body>
</html>
