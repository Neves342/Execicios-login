<!DOCTYPE html>
<html lang="Pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terceira Tela de Login</title>
    <link rel="stylesheet" href="login3.css">
</head>
<body>
    <main>
        <div>
            <div>
                <img src="Senac branco.png" alt="logo branco Senac">
                <h1>Music Hall</h1>
            </div>
            <div>
                <form>
                    <label for="email">Login:</label>
                    <input type="email" name="email" id="email" placeholder="Email ou CPF">
                    <label for="email">Senha:</label>
                    <input type="password" name="password" id="password" placeholder="Senha">
                </form>
                <button type="submit">Entrar</button>
                <p>Esqueci senha</p> 
            </div>
        </div>
    </main>
</body>
</html>
