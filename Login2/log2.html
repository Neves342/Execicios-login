<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segundo login</title>
    <link rel="stylesheet" href="log2.css">
</head>
<body>
    <main>
        <div class="container">
            <div class="intro">
                <img src="Senac azul.png" alt="logo azul senac">
                <h1>Music Hall</h1>
            </div>
            <form action="login" class="intro">
                <label for="email">Login</label>
                <input type="email"  name="email" id="email" placeholder="Email ou Senha">
                <label for="name">Senha</label>
                <input type="password"  name="senha" id="senha" placeholder="Senha">
                <button type="submit">Entrar</button>
            </form>
        </div>
    </main>
</body>
</html>
