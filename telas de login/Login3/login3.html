<!DOCTYPE html>
<html lang="Pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terceira Tela de Login</title>
    <link rel="stylesheet" href="login3.css">
    <script src="eye.js" defer></script>
</head>
<body>
    <main>
        <div class="container">
            <div class="intro">
                <img src="Senac branco.png" alt="logo branco Senac">
                <h1>Music Hall</h1>
            </div>
            <form class="form">
                <label for="email">Login:</label>
                <input type="email" name="email" id="email" placeholder="Email ou CPF">
                <label for="email">Senha:</label>
                <div>
                <input type="password" name="senha" id="senha" placeholder="Senha">
                <img src="eye.png" alt="mostrar senha" class="im" onclick="mostrar_senha()">
                </div>
                <button type="submit">Entrar</button>
                <img src="linha1.png" alt="linha branca" class="im2">
                <p><a href="esqueci-senha">Esqueci senha</a></p> 
            </form>
        </main>
</body>
</html>
