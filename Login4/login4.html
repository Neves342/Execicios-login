<!DOCTYPE html>
<html lang="Pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarta Tela de Login</title>
    <link rel="stylesheet" href="login4.css">
</head>
<body>
<main>
    <img src="imagem-4.png" alt="" class="img">
    <div class="container1">
     <div class="introo">
        <img src="Senac azul.png" alt="logo azul senac">
        <h1>Music Hall</h1>
     </div>
     <form class="form">
        <div class="quadro-branco"></div>

        <label for="email">Login:</label>
        <input type="email" name="email" id="email" placeholder="Email ou CPF" >

        <label for="password">Senha:</label>
        <div class="campo-senha">
          <input type="password" name="password" id="password" placeholder="Senha">
          <img src="eye.png" alt="mostrar senha">
        </div>
        
        <button type="submit">Entrar</button>
        <img class="linha" src="linha.png" alt="linha branca">
        <p><a href="esqueci senha">Esqueci a senha</a></p>
        <img class="seta" src="seta.png" alt="">
     </form>
    </div>
</main>
</body>
</html>
